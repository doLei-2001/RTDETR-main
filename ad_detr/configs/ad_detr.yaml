# ============================================================================
# AD-DETR 模型配置文件
# ============================================================================
# 论文: 基于深度学习的自动驾驶目标检测算法研究
# 框架: 基于 RT-DETR 改进
#
# 【模块对应关系】
#   SRFD (CAS-FD)               — §3.3.1 内容感知选择性特征下采样
#   C2f_DCMB (LDC)              — §4.2   动态Inception轻量化混合器
#   TransformerEncoderLayer_Pola — §3.4   极性感知空间增强编码器 PASE
#   SPDConv + CSPOmniKernel      — §3.3.2 自适应协同融合金字塔 ACFP
# ============================================================================

# Parameters
nc: 80  # number of classes (BDD100K=10, KITTI=3, COCO=80)
scales:
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

# ============================================================================
# Backbone (主干网络)
# ============================================================================
# 原始 RT-DETR r18 Backbone:
#   ConvNormLayer×3 + MaxPool → P2/4
#   Blocks(BasicBlock×2) ×4 stages → P3/8, P4/16, P5/32
#
# AD-DETR Backbone 改进:
#   1. SRFD 替代原始 Stem (CAS-FD: 三路并行下采样保护小目标信息)
#   2. C2f_DCMB 替代 Blocks(BasicBlock) (LDC: 轻量化多尺度特征提取)
backbone:
  # [from, repeats, module, args]
  # -----------------------------------------------------------------
  # Stage 0: CAS-FD Stem → P2/4
  # SRFD = 内容感知选择性下采样
  # 输入 [B,3,640,640] → 输出 [B,64,160,160]
  # 三路分支: DetB(Cut细节) + SemB(Conv语义) + SalB(MaxPool显著性)
  - [-1, 1, SRFD, [64]] # 0-P2/4

  # -----------------------------------------------------------------
  # Stage 1: LDC 轻量化 Stage → P2/4 (保持分辨率)
  # C2f_DCMB = C2f + DynamicIncMixerBlock (替代 BasicBlock)
  # DynamicIncMixerBlock = MBDC三路深度卷积 + DKW动态权重 + CSM通道分割
  - [-1, 1, C2f_DCMB, [128]] # 1

  # -----------------------------------------------------------------
  # Stage 2: LDC 轻量化 Stage → P3/8
  - [-1, 1, Conv, [256, 3, 2]]  # 2-P3/8 (步长卷积下采样)
  - [-1, 1, C2f_DCMB, [256]]    # 3

  # -----------------------------------------------------------------
  # Stage 3: LDC 轻量化 Stage → P4/16
  - [-1, 1, Conv, [384, 3, 2]]  # 4-P4/16
  - [-1, 1, C2f_DCMB, [384]]    # 5

  # -----------------------------------------------------------------
  # Stage 4: LDC 轻量化 Stage → P5/32
  - [-1, 1, Conv, [384, 3, 2]]  # 6-P5/32
  - [-1, 3, C2f_DCMB, [384]]    # 7 (3个LDC Block, 最深stage)

# ============================================================================
# Head (混合编码器 + 解码器)
# ============================================================================
# AD-DETR Head 改进:
#   1. PASE 替代 AIFI (极性感知注意力替换 Softmax 自注意力)
#   2. ACFP 引入 P2 特征 (SPDConv无损降维 + CSPOmniKernel多尺度增强)
#   3. MFM 多路融合模块替代简单 Concat
head:
  # ===================================================================
  # P5 编码: PASE (极性感知空间增强编码器)
  # ===================================================================
  # 项目: P5 → Conv → PASE → Conv → Y5 lateral
  # 论文: PASE 替换原始 AIFI，在 O(N) 复杂度下实现高质量全局建模
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 8 input_proj.2 (P5→256ch)

  # PASE 编码器: PolaAttention + ACGF(ConvolutionalGLU)
  # PolaAttention: 极性分离 + 可学习幂次 + 同号/异号双路注意力
  # ACGF: 双输入 + 空间门控 + 残差增强
  - [-1, 1, TransformerEncoderLayer_Pola_SEFN_Mona, [1024, 8]] # 9

  - [-1, 1, Conv, [256, 1, 1]]  # 10, Y5, lateral_convs.0

  # ===================================================================
  # FPN 自顶向下路径 (P5 → P4 → P3 → P2)
  # ===================================================================
  # P5 → P4
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 11
  - [5, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 12 input_proj.1 (P4→256ch)
  - [[-2, -1], 1, MFM, [256]] # 13 MFM 自适应融合 (P5_up + P4)
  - [-1, 3, RepC3, [256, 0.5]]  # 14, fpn_blocks.0
  - [-1, 1, Conv, [128, 1, 1]]   # 15, Y4, lateral_convs.1

  # P4 → P3 + P2 (ACFP: 自适应协同融合金字塔)
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 16
  # SPDConv: 空间-深度卷积，将 P2 特征无损降采样
  # 输入 [B,128,160,160] → 输出 [B,128,80,80]
  - [1, 1, SPDConv, [128]] # 17 (从 backbone P2 层获取特征)

  # ACFP 三路融合: P2(SPDConv) + P3 + Y4(自顶向下)
  - [[-1, -2, 2], 1, MFM, [256]] # 18 MFM 三路自适应加权融合

  # CSPOmniKernel: CAFE 多尺度特征增强
  # 25%通道经过 OmniKernel (全局+局部+大核), 75%通道恒等映射
  - [-1, 1, CSPOmniKernel, []] # 19

  - [-1, 3, RepC3, [256, 0.5]] # 20 P3 融合输出

  # ===================================================================
  # PAN 自底向上路径 (P3 → P4 → P5)
  # ===================================================================
  # P3 → P4
  - [-1, 1, Conv, [256, 3, 2]] # 21 下采样
  - [[-1, 15], 1, MFM, [256]] # 22 MFM 融合 (P3_down + Y4)
  - [-1, 3, RepC3, [256, 0.5]] # 23 P4 输出

  # P4 → P5
  - [-1, 1, Conv, [256, 3, 2]] # 24 下采样
  - [[-1, 10], 1, MFM, [256]] # 25 MFM 融合 (P4_down + Y5)
  - [-1, 3, RepC3, [256, 0.5]] # 26 P5 输出

  # ===================================================================
  # Decoder (RT-DETR 解码器 + 预测头)
  # ===================================================================
  # 输入: P3(20), P4(23), P5(26) 特征图
  # IoU-aware 查询选择 + 可变形注意力解码
  # 输出: 300 个检测结果 (bbox + class scores)
  - [[20, 23, 26], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # 27

# ============================================================================
# 论文消融实验配置参考
# ============================================================================
# Baseline (RT-DETR r18):       rtdetr-r18.yaml
# + CAS-FD:                     rtdetr-SRFD.yaml (SRFD替换Stem)
# + ACFP:                      rtdetr-SRFD-SOEP.yaml (+CSPOmniKernel)
# + PASE:                      rtdetr-SRFD-SOEP-MFM-Pola.yaml (+PASE)
# 完整 AD-DETR (本文方法):      本文件
# ============================================================================
