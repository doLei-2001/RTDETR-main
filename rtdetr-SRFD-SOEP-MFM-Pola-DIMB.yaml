# Ultralytics YOLO 🚀, AGPL-3.0 license
# RT-DETR-l object detection model with P3-P5 outputs. For details see https://docs.ultralytics.com/models/rtdetr

# Parameters
nc: 80  # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-cls.yaml' will call yolov8-cls.yaml with scale 'n'
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

# From BiliBili 魔鬼面具
backbone:
  # [from, repeats, module, args]
  - [-1, 1, SRFD, [64]] # 0-P2/4    # 模块88 SRFD
  - [-1, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']] # 1
  - [-1, 1, C2f_DCMB, [128]]        # 模块180 DIMB
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 1, C2f_DCMB, [256]]
  - [-1, 1, Conv, [384, 3, 2]]  # 5-P4/16
  - [-1, 1, C2f_DCMB, [384]]
  - [-1, 1, Conv, [384, 3, 2]]  # 7-P5/32
  - [-1, 3, C2f_DCMB, [384]]


head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 0 input_proj.2
  - [-1, 1, TransformerEncoderLayer_Pola, [1024, 8]] # 10  # 模块170 AIFI-Pola
  - [-1, 1, Conv, [256, 1, 1]]  # 11, Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 12
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 13 input_proj.1
  - [[-2, -1], 1, MFM, [256]] # 14
  - [-1, 3, RepC3, [256, 0.5]]  # 15, fpn_blocks.0
  - [-1, 1, Conv, [128, 1, 1]]   # 16, Y4, lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 17
  - [2, 1, SPDConv, [128]] # 18
  - [[-1, -2, 4], 1, MFM, [256]] # 19   # 模块248 SOEP-MFM
  - [-1, 1, CSPOmniKernel, []] # 20
  - [-1, 3, RepC3, [256, 0.5]] # 21

  - [-1, 1, Conv, [256, 3, 2]] # 22
  - [[-1, 16], 1, MFM, [256]] # 23
  - [-1, 3, RepC3, [256, 0.5]] # 24

  - [-1, 1, Conv, [256, 3, 2]] # 25
  - [[-1, 11], 1, MFM, [256]] # 26
  - [-1, 3, RepC3, [256, 0.5]] # 27

  - [[21, 24, 27], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # RTDETRDecoder(P3, P4, P5)  # 28