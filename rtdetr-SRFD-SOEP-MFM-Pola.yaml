# Ultralytics YOLO 🚀, AGPL-3.0 license
# RT-DETR-l object detection model with P3-P5 outputs. For details see https://docs.ultralytics.com/models/rtdetr

# Parameters
nc: 80  # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-cls.yaml' will call yolov8-cls.yaml with scale 'n'
  # [depth, width, max_channels]
  l: [1.00, 1.00, 1024]

# From BiliBili 魔鬼面具
backbone:
  # [from, repeats, module, args]
  # 1. 使用模块88 (SRFD) 作为 Stem，替换原始的Conv+Pool，直接生成高质量 P2/4
  - [-1, 1, SRFD, [64]] # 0-P2/4

  # [ch_out, block_type, block_nums, stage_num, act, variant]
  # 2. Stage 2 (P2/4)，保持 BasicBlock
  - [-1, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']] # 1

  # 3. Stage 3 (P3/8)，使用模块52 (DCNv4)，解决密集的中-小目标
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']] # 2-P3/8

  # 4. Stage 4 (P4/16)，使用模块52 (DCNv4)，解决密集的中-大目标
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']] # 3-P4/16

  # 5. Stage 5 (P5/32)，使用模块52 (DCNv4)，解决密集的大目标
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']] # 4-P5/32

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 5 input_proj.2
  - [-1, 1, TransformerEncoderLayer_Pola, [1024, 8]] # 6
  - [-1, 1, Conv, [256, 1, 1]]  # 7, Y5, lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 8
  - [3, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 9 input_proj.1
  - [[-2, -1], 1, MFM, [256]] # 10
  - [-1, 3, RepC3, [256, 0.5]]  # 11, fpn_blocks.0
  - [-1, 1, Conv, [128, 1, 1]]   # 12, Y4, lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 13
  - [1, 1, SPDConv, [128]] # 14
  - [[-1, -2, 2], 1, MFM, [256]] # 15  这个是p2 p3 y4融合
  - [-1, 1, CSPOmniKernel, []] # 16
  - [-1, 3, RepC3, [256, 0.5]] # 17

  - [-1, 1, Conv, [256, 3, 2]] # 18
  - [[-1, 12], 1, MFM, [256]] # 19
  - [-1, 3, RepC3, [256, 0.5]] # 20

  - [-1, 1, Conv, [256, 3, 2]] # 21
  - [[-1, 7], 1, MFM, [256]] # 22
  - [-1, 3, RepC3, [256, 0.5]] # 23

  - [[17, 20, 23], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]  # RTDETRDecoder(P3, P4, P5)  # 24

